name: Sample Orca SAST Scan Workflow2
on:
  push:
    branches: ["main"]
  pull_request:
    branches: [ "main" ]
 
jobs: 
  orca-sast_scan:
    name: Orca SAST Scan
    runs-on: ubuntu-latest
    env:
      PROJECT_KEY: ccp
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Run Orca SAST Scan
        id: orca-sast-scan
        uses: orcasecurity/shiftleft-sast-action@v1
        with:
          api_token: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
          project_key: ${{ env.PROJECT_KEY }}
          debug: true
          log_path: orca_results/
          custom_sast_controls: custom-sast-rules/ 
          path:
            "./actual-code"  
            
      - name: Orca Debugs
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.orca-sast-scan.outputs.exit_code != 0 }}
        with:
          name: orca-debugs
          path: |
            orca_results
 
